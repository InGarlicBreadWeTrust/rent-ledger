[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rent-ledger"
version = "1.0.0"
description = "Local-first rental ledger, lease renewals, and maintenance tracker. Pure stdlib, zero third-party runtime deps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "InGarlicBreadWeTrust" }]
keywords = ["rent", "ledger", "lease", "maintenance", "late-fee", "csv", "cli"]
classifiers = [
     "Programming Language :: Python :: 3",
     "Programming Language :: Python :: 3 :: Only",
     "License :: OSI Approved :: MIT License",
     "Intended Audience :: Developers",
     "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rent-ledger = "rent_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["rent_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
